[platformio]
default_envs = homelab_s3_landscape3

[env:homelab_s3]
platform = espressif32@6.13.0
board = esp32s3box
framework = arduino
board_build.partitions = partitions.csv
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lvgl/lvgl@9.3.0
    bblanchon/ArduinoJson@7.4.2
build_unflags = -std=gnu++11
build_flags = ${env.build_flags}
    -std=gnu++17

[env]
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

; Pebble Landscape is the current enclosure. Other rotations remain explicit.
[env:homelab_s3_portrait0]
extends = env:homelab_s3
build_flags = ${env:homelab_s3.build_flags}
    -DHOMELAB_ROTATION=0

[env:homelab_s3_portrait2]
extends = env:homelab_s3
build_flags = ${env:homelab_s3.build_flags}
    -DHOMELAB_ROTATION=2

[env:homelab_s3_landscape1]
extends = env:homelab_s3
build_flags = ${env:homelab_s3.build_flags}
    -DHOMELAB_ROTATION=1

[env:homelab_s3_landscape3]
extends = env:homelab_s3
build_flags = ${env:homelab_s3.build_flags}
    -DHOMELAB_ROTATION=3

; Downloadable Web Serial firmware contains no private build defaults.
[env:homelab_s3_web]
extends = env:homelab_s3_landscape3
build_flags = ${env:homelab_s3_landscape3.build_flags}
    -DGLIMDOCK_PUBLIC_FIRMWARE=1

; Optional full-panel bars build for physical RGB/orientation verification.
[env:homelab_s3_portrait0_color_test]
extends = env:homelab_s3_portrait0
build_flags = ${env:homelab_s3_portrait0.build_flags}
    -DHOMELAB_COLOR_TEST=1
