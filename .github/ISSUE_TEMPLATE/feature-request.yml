name: Feature or integration request
description: Propose an improvement or a read-only monitoring integration.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed behavior
      description: Describe the monitoring problem and what the display should show.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Hardware or API evidence
      description: Link official documentation; use synthetic examples. For V2, include controller/pins/dimensions and physical test results.
