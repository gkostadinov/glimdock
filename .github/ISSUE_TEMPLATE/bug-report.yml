name: Bug report
description: Report a reproducible collector, firmware or display problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include Wi-Fi passwords, Bearer/API tokens, SSH keys or real private snapshots. Report security vulnerabilities through the private advisory form instead."
  - type: input
    id: version
    attributes:
      label: Glimdock version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Platform
      description: Collector OS/architecture and board revision, if relevant.
      placeholder: Proxmox/Linux x86_64; Waveshare V1 CST328
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: What did you do, what happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Minimal redacted logs or authored synthetic fixture; no private telemetry.
